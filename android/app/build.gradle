plugins {
    id 'com.android.application'
}
// Push (Firebase): ativado quando app/google-services.json existe
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def appUrl = project.findProperty('appUrl') ?: 'https://walisson-imoveis.onrender.com'

// Assinatura: lida de android/keystore.properties (fora do git). Sem ele, usa a chave de depuração.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'br.com.walissonimoveis.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.walissonimoveis.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        resValue 'string', 'app_host', new URI(appUrl).host
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
}
